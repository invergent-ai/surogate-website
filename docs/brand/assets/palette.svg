ariable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#0a0a0a" fill-opacity=".6">Dividers and borders</text><rect x="270" y="336" width="200" height="120" rx="12" fill="#2a102d"/><text x="270" y="482" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0a0a0a">aubergine</text><text x="270" y="502" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0a0a0a" fill-opacity=".6">#2a102d</text><text x="270" y="520" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#0a0a0a" fill-opacity=".6">Brand bands, footer</text><rect x="500" y="336" width="200" height="120" rx="12" fill="#1a0a1c"/><text x="500" y="482" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0a0a0a">night</text><text x="500" y="502" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0a0a0a" fill-opacity=".6">#1a0a1c</text><text x="500" y="520" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#0a0a0a" fill-opacity=".6">Dark tiles, terminals</text><rect x="730" y="336" width="200" height="120" rx="12" fill="#ffaf10"/><text x="730" y="482" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0a0a0a">sun</text><text x="730" y="502" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0a0a0a" fill-opacity=".6">#ffaf10</text><text x="730" y="520" font-family="