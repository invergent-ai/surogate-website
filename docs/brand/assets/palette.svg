<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1108" width="1000" height="1108" role="img" aria-label="The Surogate palette with hex values"><title>The Surogate palette with hex values</title><rect width="1000" height="1108" fill="#ffffff"/><text x="40" y="56" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#0a0a0a">Surogate palette</text><text x="40" y="84" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0a0a0a" fill-opacity=".6">tailwind.config.js. Never cream, ivory, beige or a warm off-white.</text><rect x="40" y="116" width="200" height="120" rx="12" fill="#0a0a0a"/><text x="40" y="262" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0a0a0a">ink</text><text x="40" y="282" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0a0a0a" fill-opacity=".6">#0a0a0a</text><text x="40" y="300" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#0a0a0a" fill-opacity=".6">Text, primary buttons</text><rect x="270" y="116" width="200" height="120" rx="12" fill="#ffffff" stroke="#e4e4e7"/><text x="270" y="262" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0a0a0a">white</text><text x="270" y="282" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0a0a0a" fill-opacity=".6">#ffffff</text><text x="270" y="300" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica