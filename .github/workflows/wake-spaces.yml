name: Keep the Rune demos awake

# Free Hugging Face Spaces sleep after about 48 hours without a visitor, and the next visitor waits a
# minute on a "starting" screen inside /labs. One visit a day keeps them awake. The addresses come from
# lib/labs.js, the same list the site embeds.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Visit every Space
        run: |
          node -e "import('./lib/labs.js').then(m => m.RUNE_DEMOS.forEach(d => console.log(d.embed)))" > spaces.txt
          failed=0
          while read -r url; do
            # a sleeping Space answers slowly while it starts; give it up to three minutes
            if curl -fsS -o /dev/null --retry 12 --retry-delay 15 --retry-all-errors --max-time 60 "$url"; then
              echo "awake  $url"
            else
              echo "::error::no answer from $url"; failed=1
            fi
          done < spaces.txt
          exit $failed
